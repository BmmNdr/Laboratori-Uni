<!DOCTYPE html>
<html>
  <head>
    <title>Archivio di tastiere</title>
  </head>

  <body>
    <script>
      const json = `[
  {
    "name": "K55 RGB PRO",
    "manufacturer": "Corsair",
    "year": 2023,
    "ergonomic": true,
    "backlight": true,
    "layout": "QWERTY"
  },
  {
    "name": "K30",
    "manufacturer": "Corsair",
    "year": 2020,
    "ergonomic": false,
    "backlight": false,
    "layout": "QWERTY"
  },
  {
    "name": "G213",
    "manufacturer": "Logitech",
    "year": 2020,
    "ergonomic": false,
    "backlight": true,
    "layout": "Dvorak"
  }
]`

      window.onload = init;

      function init() {
        // Parsing del JSON.
        const keyboards = JSON.parse(json);
        
        // Creazione degli elementi della tabella.
        const table = document.createElement("table");
        const caption = table.createCaption();
        caption.appendChild(document.createTextNode("Lista delle tastiere"));

        // Intestazione
        const thead = table.createTHead();
        const theadRow = thead.insertRow();
        for (property in keyboards[0]) {
          let cell = document.createElement("th");
          cell.appendChild(document.createTextNode(property))
          theadRow.appendChild(cell);

          //theadRow.insertCell().textContent = property
        }
        table.thead = thead;

        // Elementi
        const tbody = table.createTBody()
        for (keyboard of keyboards) {
          let tableRow = tbody.insertRow();

          for (property in keyboard) {
            let tableData = tableRow.insertCell().textContent = keyboard[property];
          }
        }


        // Aggiunta della tabella nel DOM (verrà subito visualizzato).
        table.border = 1;
        document.body.appendChild(table);
      }
    </script>
  </body>
</html>
