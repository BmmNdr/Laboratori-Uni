<!DOCTYPE html>
<html>

  <head>
    <title>Keyboard App</title>
  </head>

  <body>
    <h1>
      Keyboard App
    </h1>

    <h2>List of saved keyboards</h2>
    <table border="1">
      <thead>
        <tr>
          <th>Name</th>
          <th>Manufacturer</th>
          <th>Year</th>
          <th>Ergonomic</th>
          <th>Backlight</th>
          <th>Layout</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>

    <hr>

    <h2>Add a new keyboard</h2>
    <form action="/keyboard" method="POST">
      <p>
        <label for="name">Name:</label>
        <br>
        <input type="text" id="name" name="name" value="" />
      </p>

      <p>
        <label for="manufacturer">Manufacturer:</label>
        <br>
        <input type="text" id="manufacturer" value="" />
      </p>

      <p>
        <label for="year">Year:</label>
        <br>
        <input type="number" id="year" value="" />
      </p>

      <p>
        <label for="ergonomic">Ergonomic:</label>
        <br>
        <input type="checkbox" id="ergonomic" value="" />
      </p>

      <p>
        <label for="backlight">Backlight:</label>
        <br>
        <input type="checkbox" id="backlight" value="" />
      </p>

      <p>
        <label for="layout">Layout:</label>
        <br>
        <select id="layout" name="layout">
          <option value="QWERTY">QWERTY</option>
          <option value="AZERTY">AZERTY</option>
          <option value="Dvorak">Dvorak</option>
        </select>
      </p>

      <p>
        <input type="submit" value="Submit" />
      </p>
    </form>
    <script>
      window.onload = init;
      
      function init() {
        const form = document.querySelector("form");
        form.addEventListener("submit", addElement);
      };

      function addElement(event){
        event.preventDefault();

        const form = event.target;

        const inputs = form.querySelectorAll("input");
        console.log(inputs);

        //let keyboard = {};
        //for(let input of inputs) {
        //  console.log(input);
        //  keyboard[input] += input.value;
        //}
//
        //console.log(keyboard);

        const tbody = document.querySelector("table").querySelector("tbody");
        let row = tbody.insertRow();

        let cell = row.insertCell();
        cell.textContent = form.querySelector("#name").value;

        cell = row.insertCell();
        cell.textContent = form.querySelector("#manufacturer").value;

        cell = row.insertCell();
        cell.textContent = form.querySelector("#year").value;

        cell = row.insertCell();
        cell.textContent = form.querySelector("#ergonomic").checked;

        cell = row.insertCell();
        cell.textContent = form.querySelector("#backlight").checked;

        cell = row.insertCell();
        cell.textContent = form.querySelector("#layout").value;

        cell = row.insertCell();
        let button = document.createElement("button");
        button.textContent = "Remove";
        button.onclick = removeRow;
        cell.appendChild(button)
      }

      function removeRow(event) {
        event.currentTarget.parentNode.parentNode.remove();
      }
    </script>
  </body>
</html>
